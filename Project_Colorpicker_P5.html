<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js Example</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    /* Entfernt den Rahmen des p5.js-Canvas */
    canvas {
      border: none;
      display: block;
      /* Entfernt eventuelle Scrollleisten */
    }

    body {
      margin: 0;
      /* Entfernt den Standardabstand des Body */
      overflow: hidden;
      background: lightgrey;
      /* Verhindert Scrollen */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>

<body>
  <script>
    let ellipses = [];

    function setup() {
      createCanvas(600, 400);
      colorMode(HSB, 360, 100, 100);
      noStroke();

      ellipses.push(new ColorEllipse(150, 200, 150));
      ellipses.push(new ColorEllipse(300, 200, 150));
      ellipses.push(new ColorEllipse(450, 200, 150));
    }

    function draw() {
      background(220);


      for (let e of ellipses) {
        e.update();
        e.display();
      }
    }

    function mousePressed() {
      let clickedAny = false;


      for (let e of ellipses) {
        if (e.isInside(mouseX, mouseY)) {

          for (let other of ellipses) {
            other.active = false;
          }

          e.active = true;
          clickedAny = true;
          break;
        }
      }

      if (!clickedAny) {
        for (let e of ellipses) {
          e.active = false;
        }
      }
    }

    function mouseWheel(event) {
      for (let e of ellipses) {
        e.handleWheel(event);
      }
    }

    // CLASS
    class ColorEllipse {
      constructor(x, y, diameter) {
        this.x = x;
        this.y = y;
        this.d = diameter;
        this.active = false;

        this.hue = 0;
        this.sat = 100;
        this.brightness = 100;
      }

      update() {
        if (this.active) {
          this.sat = map(mouseX, 0, width, 0, 100);
          this.brightness = map(mouseY, 0, height, 0, 100);
        }
      }

      display() {
        fill(this.hue, this.sat, this.brightness);
        ellipse(this.x, this.y, this.d);

        if (this.active) {
          stroke(0);
          strokeWeight(3);
          noFill();
          ellipse(this.x, this.y, this.d + 8);
          noStroke();
        }
      }

      isInside(px, py) {
        return dist(px, py, this.x, this.y) < this.d / 2;
      }

      handleWheel(event) {
        if (this.active) {
          this.hue -= event.delta * 0.5;
          this.hue = (this.hue + 360) % 360;
        }
      }
    }
  </script>
</body>

</html>
