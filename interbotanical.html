                        background-color: var(--bg-color);
                        color: var(--text-color);
                        font-family: sans-serif;

                }

                /* 2. HEADER */

                        text-align: center;
                        padding: 0px 20px;
                }

                h1 {
                        margin: 0;
                        font-size: 2.5rem;
                        letter-spacing: 0.1em;
                        text-transform: uppercase;
                        font-weight: 300;
                }

                /* 3. GALERIE (Einfaches Scroll-Layout) */
                .gallery {
                        display: block;
                        /* Kein Flexbox-Chaos mehr */
                        width: 100%;
                        max-width: 1300px;
                        margin: 0 auto;
                        /* Zentriert die Galerie */
                        padding-bottom: 100px;
                }

                .image-wrapper {
                        margin-bottom: 80px;
                        /* Abstand zwischen den Bildern */
                        width: 100%;
                }

                .image-wrapper img {
                        width: 100%;
                        height: auto;
                        display: block;
                        border-radius: 2px;
                        /* mix-blend-mode: multiply; */
                        /* Ein ganz simpler Schatten für etwas Tiefe */
                        filter: drop-shadow(10px 10px 15px rgba(0, 0, 0, 0.3));
                }

                /* 4. FORTSCHRITTSBALKEN (Optional, oben am Rand) */
                #progress-bar {
                        position: fixed;
                        top: 0;
                        left: 0;
                        height: 4px;
                        background: #333;
                        width: 0%;
                        z-index: 1000;
                }
        </style>

        <script>
                // Scroll Progress Bar
                window.addEventListener('scroll', () => {
                        const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                        const scrolled = (winScroll / height) * 100;
                        document.getElementById("progress-bar").style.width = scrolled + "%";
                });

                // Intersection Observer for fade-in effect when scrolling down
                const observerOptions = {
                        root: null,
                        rootMargin: '0px',
                        threshold: 0.1
                };

                const observer = new IntersectionObserver((entries, observer) => {
                        entries.forEach(entry => {
                                if (entry.isIntersecting) {
                                        entry.target.classList.add('visible');
                                        observer.unobserve(entry.target);
                                }
                        });
                }, observerOptions);

                document.querySelectorAll('.image-wrapper').forEach(wrapper => {
                        observer.observe(wrapper);
                });
        </script>
