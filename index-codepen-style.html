<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini CodePen</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .editor-container {
      display: flex;
      flex: 1;
    }

    textarea {
      flex: 1;
      padding: 1rem;
      font-family: monospace;
      font-size: 14px;
      border: 1px solid #ccc;
      resize: none;
      height: 100%;
    }

    iframe {
      flex: 1;
      border: none;
      height: 100%;
    }

    .panel {
      width: 33.3%;
      display: flex;
      flex-direction: column;
    }

    .panel label {
      padding: 0.5rem;
      font-weight: bold;
      background: #f0f0f0;
      border-bottom: 1px solid #ccc;
    }

    .preview {
      height: 50vh;
      border-top: 1px solid #ccc;
    }
  </style>
</head>
<body>

<div class="editor-container">
  <div class="panel">
    <label>HTML</label>
    <textarea id="html" placeholder="Type HTML here...">
<div class="card">
<div id="canvas-container"></div>
</div>
    </textarea>
  </div>
  <div class="panel">
    <label>CSS</label>
    <textarea id="css" placeholder="Type CSS here...">
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
}
    </textarea>
  </div>
  <div class="panel">
    <label>JavaScript</label>
    <textarea id="js" placeholder="Type JavaScript here...">
function setup() {
  createCanvas(windowWidth, windowHeight);
  background(30);
}
//you can make a simple pen
function draw() {
  
  let pen1 = map(sin(frameCount*0.1),-1,1,3,20)
  if (mouseIsPressed) {
    stroke(255);
    strokeWeight(pen1);
    line(prevX, prevY, mouseX, mouseY);
  }
  prevX = mouseX;
  prevY = mouseY;
} 

function keyPressed(){
	if(key == 'S'){
		save('pen.png') // save hydra texture
	}
}


    </textarea>
  </div>
</div>

<iframe id="preview" class="preview"></iframe>

<script>
const htmlInput = document.getElementById("html");
const cssInput = document.getElementById("css");
const jsInput = document.getElementById("js");
const previewFrame = document.getElementById("preview");

function updatePreview() {
  const html = htmlInput.value;
  const css = `<style>${cssInput.value}</style>`;
  const p5Script = '<script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.js"><\/script>';
  const js = `${p5Script}<script>${jsInput.value}<\/script>`;
  const blob = new Blob([html + css + js], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  previewFrame.src = url;
}

htmlInput.addEventListener("input", updatePreview);
cssInput.addEventListener("input", updatePreview);
jsInput.addEventListener("input", updatePreview);

updatePreview();
</script>

</body>
</html>
