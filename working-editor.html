<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Working Hydra Editor</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; overflow: hidden; display: flex; height: 100vh; background: #000; }
    
    .editor-container { display: flex; width: 100%; height: 100%; }
    .left-panels { width: 50%; display: flex; flex-direction: column; }
    .center-panel { width: 50%; display: flex; flex-direction: column; }
    
    .panel { flex: 1; display: flex; flex-direction: column; border: 1px solid #ccc; }
    .panel label { padding: 0.5rem; font-weight: bold; background: #f0f0f0; border-bottom: 1px solid #ccc; margin: 0; }
    
    textarea { 
      flex: 1; 
      padding: .25rem; 
      font-family: monospace; 
      font-size: .75rem; 
      border: none; 
      resize: none; 
      outline: none; 
    }
    
    iframe { flex: 1; border: none; width: 100%; height: 100%; }
    .preview { flex: 1; }
  </style>
</head>
<body>

<div class="editor-container">
  <!-- Linke Seite: Code -->
  <div class="left-panels">
    <div class="panel">
      <label>JavaScript</label>
      <textarea id="js">// Einfacher p5.js Test
let x = 0;
let y = 0;

function setup() {
  createCanvas(400, 400);
  background(220);
}

function draw() {
  fill(255, 0, 0);
  ellipse(x, y, 50, 50);
  
  x += 2;
  y += 1;
  
  if (x > width) {
    x = 0;
  }
  if (y > height) {
    y = 0;
  }
}</textarea>
    </div>
    
    <div class="panel">
      <label>Hydra</label>
      <textarea id="hydra">// Hier später Hydra Code</textarea>
    </div>
  </div>

  <!-- Rechte Seite: Preview -->
  <div class="center-panel">
    <div class="panel">
      <label>Preview</label>
      <iframe id="preview" class="preview"></iframe>
    </div>
  </div>
</div>

<script>
const jsInput = document.getElementById("js");
const hydraInput = document.getElementById("hydra");
const previewFrame = document.getElementById("preview");

function updatePreview() {
  const html = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
    }
    
    canvas {
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.js"><\/script>
  
  <script>
    ${jsInput.value}
  <\/script>
</body>
</html>`;
  
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  
  // Alte URL freigeben
  if (previewFrame.src && previewFrame.src.startsWith('blob:')) {
    URL.revokeObjectURL(previewFrame.src);
  }
  
  previewFrame.src = url;
}

jsInput.addEventListener("input", updatePreview);
hydraInput.addEventListener("input", updatePreview);
updatePreview();
</script>

</body>
</html>
