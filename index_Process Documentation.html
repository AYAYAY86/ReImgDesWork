<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reimagine Design Tools</title>
  <style>
    body {
      margin: 0;
      font-family: 'Consolas', 'Menlo', 'Monaco', 'Courier New', monospace;
      background-color: #fff;
      color: #000;
    }

    header {
      position: sticky;
      top: 0;
      background: white;
      padding: 1rem;
      border-bottom: 1px solid #ddd;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    header h1 {
      font-size: 1.25rem;
      margin: 0;
    }

    .header-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .header-btn {
      font-size: 0.8rem;
      margin: 0.15rem;
      padding: 0.3rem 0.6rem;
      background: black;
      color: white;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      transition: background 0.3s ease;
      line-height: 1;
    }

    .header-btn:hover {
      background: palevioletred;
    }

    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }

    .project {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      cursor: pointer;
    }

    .project img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .project:hover img {
      transform: scale(1.05);
    }

    .project-title {
      position: absolute;
      bottom: 0;
      background: rgba(255, 255, 255, 0.8);
      width: 100%;
      padding: 0.5rem;
      font-size: 0.8rem;
      box-sizing: border-box;
    }

    .description {
      padding: 0.2rem;
      margin-top: 0.3rem;
    }

    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border: 4px solid white;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .lightbox.hidden {
      display: none;
    }

.lightbox-description {
  position: absolute;
  bottom: 1rem;
  left: 1rem;
  right: 1rem;
  background: rgba(255, 255, 255, 0.9);
  color: black;
  padding: 0.6rem;
  font-size: 0.85rem;
  font-style: italic;
  z-index: 10;
  text-align: left;
  border-radius: 4px;
}

    #closeBtn {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 2rem;
      color: white;
      cursor: pointer;
      font-family: sans-serif;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.5rem;
      background: none;
      color: white;
      border: none;
      cursor: pointer;
      padding: 1rem;
      user-select: none;
      z-index: 1001;
    }

    #prevBtn { left: 1rem; }
    #nextBtn { right: 1rem; }

    .nav-btn:hover {
      color: palevioletred;
    }
  </style>
</head>

<body>
  <header>
     <a href="index.html" style="text-decoration:none; color:inherit;">
      <h1>Reimagine Design Tools</h1>
    </a>
    <div class="header-buttons">
      <a href="index_Video Documentation.html" class="header-btn" target="_blank">Video Documentation</a>
      <a href="index.html" class="header-btn" target="_blank">Reimagine Design Tools</a>
    </div>
  </header>

  <div id="lightbox" class="lightbox hidden">
    <span id="closeBtn">&times;</span>
    <div id="lightbox-description" class="lightbox-description"></div>
    <img id="lightbox-image" />
    <button id="prevBtn" class="nav-btn">&#10094;</button>
    <button id="nextBtn" class="nav-btn">&#10095;</button>
  </div>

  <main id="project-container"></main>

  <script>
    const projectData = [
  {
    title: "4# cursor Sketch Hydra Feedback",
    image: "documentation/ML5-painter(1).png",
    description: "4# cursor Sketch Hydra Feedback"
  },
  {
    title: "RandomExperiment",
    image: "documentation/Screenshot 2025-05-09 at 17-27-43 p5.js Example.png",
    description: "RandomExperiment"
  },
  {
    title: "Bérénice Serra - Critical Publishing - IDCE HGK Basel",
    image: "documentation/Screenshot 2025-04-20 at 11-47-38 Bérénice Serra - Critical Publishing - IDCE HGK Basel.png",
    description: "Bérénice Serra - Critical Publishing - IDCE HGK Basel"
  },
  {
    title: "1# Random_Walker Hydra",
    image: "documentation/P5LIVE_hydra(12).png",
    description: "1# Random_Walker Hydra"
  },
  {
    title: "3# cursor Sketch Hydra Feedback",
    image: "documentation/P5LIVE_hydra(8).png",
    description: "3# cursor Sketch Hydra Feedback"
  },
  {
    title: "2# cursor Sketch Hydra Feedback",
    image: "documentation/P5LIVE_hydra(7).png",
    description: "2# cursor Sketch Hydra Feedback"
  },
  {
    title: "1# cursor Sketch",
    image: "documentation/P5LIVE_hydra(6).png",
    description: "1# cursor Sketch"
  },
  {
    title: "Cronenberg Naked Lunch Interface",
    image: "documentation/P5LIVE_hydra(4).jpg",
    description: "Cronenberg Naked Lunch Interface"
  },
  {
    title: "Image-Manipulation",
    image: "documentation/hydra-2025-4-2-9.35.14.png",
    description: "Image-Manipulation"
  },
  {
    title: "MS Paint Mouse Wheel",
    image: "documentation/Bildschirmfoto 2025-05-22 um 16.22.34.png",
    description: "MS Paint Mouse Wheel"
  },
  {
    title: "Older-Experiments",
    image: "documentation/Bildschirmfoto 2025-04-29 um 22.05.58.png",
    description: "Older-Experiments"
  },
  {
    title: "Interview Nolween",
    image: "documentation/Bildschirmfoto 2025-04-25 um 16.24.35.png",
    description: "Interview Nolween"
  },
  {
    title: "GUI-Quote",
    image: "documentation/Bildschirmfoto 2025-04-16 um 14.36.38.png",
    description: "GUI-Quote"
  }
];

    const container = document.getElementById("project-container");

    projectData.forEach(project => {
      const html = `
        <div class="project">
          <img src="${project.image}" alt="${project.title}">
          <div class="project-title">
            <div class="description">${project.description}</div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML("beforeend", html);
    });

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-image");
    const closeBtn = document.getElementById("closeBtn");
    const lightboxDesc = document.getElementById("lightbox-description");

    const galleryImages = Array.from(document.querySelectorAll(".project img"));
    let currentIndex = 0;

    galleryImages.forEach((img, index) => {
      img.addEventListener("click", () => {
        currentIndex = index;
        showImage(currentIndex);
      });
    });

    function showImage(index) {
      const item = projectData[index];
      if (!item) return;
      lightboxImg.src = item.image;
      lightboxDesc.textContent = item.description || "";
      lightbox.classList.remove("hidden");
    }

    closeBtn.addEventListener("click", () => {
      lightbox.classList.add("hidden");
    });

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) {
        lightbox.classList.add("hidden");
      }
    });

    document.getElementById("prevBtn").addEventListener("click", e => {
      e.stopPropagation();
      currentIndex = (currentIndex - 1 + projectData.length) % projectData.length;
      showImage(currentIndex);
    });

    document.getElementById("nextBtn").addEventListener("click", e => {
      e.stopPropagation();
      currentIndex = (currentIndex + 1) % projectData.length;
      showImage(currentIndex);
    });

    document.addEventListener("keydown", e => {
      if (!lightbox.classList.contains("hidden")) {
        if (e.key === "ArrowLeft") {
          currentIndex = (currentIndex - 1 + projectData.length) % projectData.length;
          showImage(currentIndex);
        }
        if (e.key === "ArrowRight") {
          currentIndex = (currentIndex + 1) % projectData.length;
          showImage(currentIndex);
        }
        if (e.key === "Escape") {
          lightbox.classList.add("hidden");
        }
      }
    });
  </script>
</body>
</html>
