    const container = document.getElementById("project-container");

    projectData.forEach(project => {
      const html = `
        <div class="project">
          <img src="${project.image}" alt="${project.title}">
          <div class="project-title">
            <div class="description">${project.description}</div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML("beforeend", html);
    });

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-image");
    const closeBtn = document.getElementById("closeBtn");
    const lightboxDesc = document.getElementById("lightbox-description");

    const galleryImages = Array.from(document.querySelectorAll(".project img"));
    let currentIndex = 0;

    galleryImages.forEach((img, index) => {
      img.addEventListener("click", () => {
        currentIndex = index;
        showImage(currentIndex);
      });
    });

    function showImage(index) {
      const item = projectData[index];
      if (!item) return;
      lightboxImg.src = item.image;
      lightboxDesc.textContent = item.description || "";
      lightbox.classList.remove("hidden");
    }

    closeBtn.addEventListener("click", () => {
      lightbox.classList.add("hidden");
    });

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) {
        lightbox.classList.add("hidden");
      }
    });

    document.getElementById("prevBtn").addEventListener("click", e => {
      e.stopPropagation();
      currentIndex = (currentIndex - 1 + projectData.length) % projectData.length;
      showImage(currentIndex);
    });

    document.getElementById("nextBtn").addEventListener("click", e => {
      e.stopPropagation();
      currentIndex = (currentIndex + 1) % projectData.length;
      showImage(currentIndex);
    });

    document.addEventListener("keydown", e => {
      if (!lightbox.classList.contains("hidden")) {
        if (e.key === "ArrowLeft") {
          currentIndex = (currentIndex - 1 + projectData.length) % projectData.length;
          showImage(currentIndex);
        }
        if (e.key === "ArrowRight") {
          currentIndex = (currentIndex + 1) % projectData.length;
          showImage(currentIndex);
        }
        if (e.key === "Escape") {
          lightbox.classList.add("hidden");
        }
      }
    });

    // Filter functionality
    const filterBtns = document.querySelectorAll('.filter-btn');
    const projects = document.querySelectorAll('.project');
    let currentFilter = null;

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const tag = btn.dataset.tag;
        
        // Toggle active state
        if (currentFilter === tag) {
          // Deactivate current filter
          btn.classList.remove('active');
          currentFilter = null;
          showAllProjects();
        } else {
          // Activate new filter
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = tag;
          filterProjects(tag);
        }
      });
    });

    function filterProjects(tag) {
      const projectElements = document.querySelectorAll('.project');
      projectElements.forEach((project, index) => {
        const projectItem = projectData[index];
        if (projectItem && projectItem.tags && projectItem.tags.includes(tag)) {
          project.style.display = 'block';
        } else {
          project.style.display = 'none';
        }
      });
    }

    function showAllProjects() {
      const projectElements = document.querySelectorAll('.project');
      projectElements.forEach(project => {
        project.style.display = 'block';
      });
    }
  </script>
