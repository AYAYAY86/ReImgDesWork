    const chaptersDiv = document.getElementById('chapters');
    chapters.forEach((chapter, chapIdx) => {
      const section = document.createElement('section');
      section.className = 'chapter';
      section.innerHTML = `
        <div class="chapter-text">
          <h2>${chapter.title}</h2>
          <p>${chapter.text}</p>
        </div>
        <div class="chapter-gallery"></div>
      `;
      const gallery = section.querySelector('.chapter-gallery');
      chapter.images.forEach((img, imgIdx) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.title = img.desc || '';
        item.addEventListener('click', function() {
          openLightbox(chapIdx, imgIdx);
        });
        const image = document.createElement('img');
        image.src = encodeURI(img.src);
        image.alt = img.desc || '';
        image.dataset.chapter = chapIdx;
        image.dataset.index = imgIdx;
        item.appendChild(image);
        gallery.appendChild(item);
      });
      chaptersDiv.appendChild(section);
    });
    // Lightbox-Logik
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = lightbox.querySelector('img');
    const lightboxDesc = lightbox.querySelector('.lightbox-description');
    let currentChapter = 0, currentImg = 0;
    function openLightbox(chapIdx, imgIdx) {
      currentChapter = chapIdx;
      currentImg = imgIdx;
      showLightboxImage();
      lightbox.classList.remove('hidden');
    }
    function showLightboxImage() {
      const imgObj = chapters[currentChapter].images[currentImg];
      lightboxImg.src = encodeURI(imgObj.src);
      lightboxImg.alt = imgObj.desc || '';
      lightboxDesc.textContent = imgObj.desc || '';
    }
    lightbox.querySelector('.lightbox-close').onclick = () => lightbox.classList.add('hidden');
    lightbox.querySelector('.lightbox-prev').onclick = (e) => {
      e.stopPropagation();
      const imgs = chapters[currentChapter].images;
      currentImg = (currentImg - 1 + imgs.length) % imgs.length;
      showLightboxImage();
    };
    lightbox.querySelector('.lightbox-next').onclick = (e) => {
      e.stopPropagation();
      const imgs = chapters[currentChapter].images;
      currentImg = (currentImg + 1) % imgs.length;
      showLightboxImage();
    };
    lightbox.onclick = (e) => {
      if (e.target === lightbox) lightbox.classList.add('hidden');
    };
    document.addEventListener('keydown', e => {
      if (lightbox.classList.contains('hidden')) return;
      if (e.key === 'ArrowLeft') lightbox.querySelector('.lightbox-prev').onclick(e);
      if (e.key === 'ArrowRight') lightbox.querySelector('.lightbox-next').onclick(e);
      if (e.key === 'Escape') lightbox.classList.add('hidden');
    });
  </script>
