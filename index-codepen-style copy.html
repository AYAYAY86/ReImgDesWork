<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini CodePen</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
    }

    .editor-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .left-panels {
      width: 25%;
      display: flex;
      flex-direction: column;
    }

    .center-panel {
      width: 50%;
      display: flex;
      flex-direction: column;
    }

    .right-panel {
      width: 25%;
      display: flex;
      flex-direction: column;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid #ccc;
    }

    .panel label {
      padding: 0.5rem;
      font-weight: bold;
      background: #f0f0f0;
      border-bottom: 1px solid #ccc;
      margin: 0;
    }

    textarea {
      flex: 1;
      padding: .25rem;
      font-family: monospace;
      font-size: .75rem;
      border: none;
      resize: none;
      outline: none;
    }

    iframe {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
    }

    .preview {
      flex: 1;
    }
  </style>
</head>
<body>

<div class="editor-container">
  <!-- Linke Panels: HTML und CSS übereinander -->
  <div class="left-panels">
    <div class="panel">
      <label>HTML</label>
      <textarea id="html" placeholder="Type HTML here...">
<div class="card">
<div id="canvas-container"></div>
</div>
      </textarea>
    </div>
    <div class="panel">
      <label>CSS</label>
      <textarea id="css" placeholder="Type CSS here...">
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: white;
}

canvas {
  display: block;
  max-width: 420px;
  max-height: 595px;
}

#canvas-container {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
}
      </textarea>
    </div>
  </div>

  <!-- Mittleres Panel: Resultat -->
  <div class="center-panel">
    <div class="panel">
      <label>Preview</label>
      <iframe id="preview" class="preview"></iframe>
    </div>
  </div>

  <!-- Rechtes Panel: JavaScript und Hydra übereinander -->
  <div class="right-panel">
    <div class="panel">
      <label>JavaScript</label>
      <textarea id="js" placeholder="Type JavaScript here...">
function setup() {
  createCanvas(windowWidth, windowHeight);
  background(30);
}
//create a simple pen editor
function draw() {
  
  let pen1 = map(sin(frameCount*0.1),-1,1,3,20)
  if (mouseIsPressed) {
    stroke(255);
    strokeWeight(pen1);
    line(prevX, prevY, mouseX, mouseY);
  }
  prevX = mouseX;
  prevY = mouseY;
} 

function keyPressed(){
  if(key == 'S'){
    save('pen.png') // save canvas as image
  }
}
      </textarea>
    </div>
    
    <!-- Neues Hydra Panel -->
    <div class="panel">
      <label>Hydra</label>
      <textarea id="hydra" placeholder="Type Hydra code here...">
// Hydra functions
osc(10, 0.1, 1.2)
  .color(1, 0.5, 0.8)
  .out()
      </textarea>
    </div>
  </div>
</div>

<script>
const htmlInput = document.getElementById("html");
const cssInput = document.getElementById("css");
const jsInput = document.getElementById("js");
const hydraInput = document.getElementById("hydra");
const previewFrame = document.getElementById("preview");

function updatePreview() {
  const html = htmlInput.value;
  const css = `<style>${cssInput.value}</style>`;
  const p5Script = '<script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.js"><\/script>';
  const hydraScript = '<script src="https://unpkg.com/hydra-synth@1.4.11/dist/hydra-synth.js"><\/script>';
  const js = `${p5Script}${hydraScript}<script>${jsInput.value}<\/script><script>${hydraInput.value}<\/script>`;
  const blob = new Blob([html + css + js], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  previewFrame.src = url;
}

htmlInput.addEventListener("input", updatePreview);
cssInput.addEventListener("input", updatePreview);
jsInput.addEventListener("input", updatePreview);
hydraInput.addEventListener("input", updatePreview);

updatePreview();
</script>

</body>
</html>
