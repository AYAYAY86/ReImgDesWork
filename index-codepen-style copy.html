<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini CodePen</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
    }

    .editor-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .left-panels {
      width: 25%;
      display: flex;
      flex-direction: column;
    }

    .center-panel {
      width: 50%;
      display: flex;
      flex-direction: column;
    }

    .right-panel {
      width: 25%;
      display: flex;
      flex-direction: column;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border: 1px solid #ccc;
    }

    .panel label {
      padding: 0.5rem;
      font-weight: bold;
      background: #f0f0f0;
      border-bottom: 1px solid #ccc;
      margin: 0;
    }

    textarea {
      flex: 1;
      padding: .25rem;
      font-family: monospace;
      font-size: .75rem;
      border: none;
      resize: none;
      outline: none;
    }

    iframe {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
    }

    .preview {
      flex: 1;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #hydra-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    canvas:not(#hydra-canvas) {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: transparent !important;
    }
  </style>
</head>
<body>

<div class="editor-container">
  <!-- Linke Panels: HTML und CSS übereinander -->
  <div class="left-panels">
    <div class="panel">
      <label>HTML</label>
      <textarea id="html" placeholder="Type HTML here...">
<div id="container"></div>
      </textarea>
    </div>
    <div class="panel">
      <label>CSS</label>
      <textarea id="css" placeholder="Type CSS here...">
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: white;
}

canvas {
  display: block;
  max-width: 420px;
  max-height: 595px;
}

#canvas-container {
  position: relative;
  width: 100%;
  height: 100%;
}
#hydra-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}
canvas:not(#hydra-canvas) {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  background: transparent !important;
}
      </textarea>
    </div>
  </div>

  <!-- Mittleres Panel: Resultat -->
  <div class="center-panel">
    <div class="panel">
      <label>Preview</label>
      <iframe id="preview" class="preview"></iframe>
    </div>
  </div>

  <!-- Rechtes Panel: JavaScript und Hydra übereinander -->
  <div class="right-panel">
    <div class="panel">
      <label>JavaScript</label>
      <textarea id="js" placeholder="Type JavaScript here...">
function setup() {
    let canvas = createCanvas(400, 400);
    canvas.parent('container');
}

function draw() {
    background(220);
    fill(100, 150, 255);
    ellipse(width/2, height/2, 100, 100);
}
      </textarea>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.js"></script>
<script src="https://unpkg.com/hydra-synth@1.4.11/dist/hydra-synth.js"></script>
<script>
  // ...keine hydra canvas Initialisierung...
  function setup() {
    const css = `<style>${cssInput.value}</style>`;
    const p5Script = '<script src="https://cdn.jsdelivr.net/npm/p5@1.11.8/lib/p5.js"><\/script>';
    const hydraScript = '<script src="https://unpkg.com/hydra-synth@1.4.11/dist/hydra-synth.js"><\/script>';
    const userJsScript = `<script>${jsInput.value}<\/script>`;
    const all = html + css + p5Script + hydraScript + userJsScript;
    const blob = new Blob([all], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    previewFrame.src = url;
  }

  htmlInput.addEventListener("input", updatePreview);
  cssInput.addEventListener("input", updatePreview);
  jsInput.addEventListener("input", updatePreview);

  updatePreview();
</script>

</body>
</html>
