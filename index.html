<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reimagine Design Tools</title>
  <style>
    body {
      margin: 0;
      font-family: 'Consolas', 'Menlo', 'Monaco', 'Courier New', monospace;
      background-color: #fff;
      color: #000;
    }

    header {
      position: sticky;
      top: 0;
      background: white;
      padding: 1rem 1rem 0.5rem 1rem;
      border-bottom: 1px solid #ddd;
      z-index: 10;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      /* Aligns buttons to the baseline of h1 text */
    }

    header h1 {
      font-size: 1.25rem;
      margin: 0;
      line-height: 1;
    }

    .header-buttons {
      display: flex;
      gap: 0.5rem;
      align-items: baseline;
    }

    .header-btn {
      font-size: 0.8rem;
      margin: 0.15rem;
      padding: 0.3rem 0.6rem;
      background: black;
      color: white;
      border: none;
      border-radius: 20px;
      text-decoration: none;
      transition: background 0.3s ease;
      line-height: 1;
    }

    .header-btn:hover {
      background: palevioletred;
    }

    .filters {
      margin-top: 0.25rem;
      margin-bottom: 0.25rem;
    }

    .filter-btn {
      display: inline-block;
      margin: 0rem;
      padding: 0.2rem .5rem;
      font-size: 0.8rem;
      background: #eee;
      border: 0px solid white;
      border-radius: 10px;
      cursor: pointer;
    }

    .filter-btn:hover {
      font-style: italic;
      color: palevioletred;
    }

    .filter-btn.active {
      background: black;
      color: white;
      font-style: italic;
    }

main {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1rem;
  padding: 1rem;
}

    .project {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      cursor: pointer;
    }

    .project img,
    .project video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .project:hover img,
    .project:hover video {
      transform: scale(1.05);
    }

    .project-title {
      position: absolute;
      bottom: 0;
      background: rgba(255, 255, 255, 0.8);
      width: 100%;
      padding: 0.5rem;
      font-size: 0.8rem;
      box-sizing: border-box;
    }

    .description {
      padding: 0.2rem;

      margin-top: 0.3rem;
    }

    .project-title a {
      color: black;
      text-decoration: none;
      margin: 0 0.3em;
      font-weight: normal;
    }

    .project-title a:hover {
      font-style: italic;
      color: palevioletred;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-top">
       <a href="index.html" style="text-decoration:none; color:inherit;">
      <h1>Reimagine Design Tools</h1>
    </a>
      <div class="header-buttons">
        <a href="index_Video Documentation.html" class="header-btn">Video Documentation</a>
        <a href="index_Process Documentation.html" class="header-btn">Process Documentation</a>
      </div>
    </div>
    <div class="filters">
      <span class="filter-btn" data-tag="cursor">#cursor</span>
      <span class="filter-btn" data-tag="layout">#layout</span>
      <span class="filter-btn" data-tag="interaction">#interaction</span>
      <span class="filter-btn" data-tag="experiments">#experiments</span>
    </div>
  </header>

  <main id="project-container"></main>

  <script>
    const projectData = [
      {
        title: "Project 3",
        tags: ["cursor"],
        image: "img/cursor1.png",
        href: "project3.html",
        documentation: "documentation/Project3.html",
        code: "code/Project3.js",
        description: "Beschreibung oder Zusatzinfos zu Project 3."
      },
      {
        title: "Project 4",
        tags: ["interaction"],
        image: "img/image-garden.png",
        href: "project4.html",
        documentation: "documentation/Project4.html",
        code: "code/Project4.js",
        description: "Dies ist der Inlinetext für Project 4"
      },
      {
        title: "Project 5",
        tags: ["interaction", "layout"],
        video: "img/donald_small_5.mp4",
        href: "project5.html",
        documentation: "documentation/Project5.html",
        code: "code/Project5.js",
        description: "Dies ist der Inlinetext für Project 5"
      },
      {
        title: "Project 6",
        tags: ["cursor", "interaction"],
        image: "img/cursor1.png",
        href: "project6.html",
        documentation: "documentation/Project6.html",
        code: "code/Project6.js",
        description: "Dies ist der Inlinetext für Project 6"
      }
    ];

    const container = document.getElementById("project-container");

    projectData.forEach(project => {
      const tags = project.tags.join(" ");
      const media = project.image
        ? `<img src="${project.image}" alt="${project.title}">`
        : `<video src="${project.video}" autoplay muted loop playsinline></video>`;

      const html = `
        <div class="project" data-tags="${tags}" data-href="${project.href}">
          ${media}
          <div class="project-title">
            <a href="${project.href}" target="_blank">Projekt</a> |
            <a href="${project.documentation}" target="_blank">Video</a> |
            <a href="${project.code}" target="_blank">Code</a>
            <div class="description">${project.description}</div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML("beforeend", html);
    });

    // Make project box clickable
    document.querySelectorAll('.project').forEach(project => {
      project.addEventListener('click', e => {
        if (e.target.tagName.toLowerCase() !== 'a') {
          const url = project.getAttribute('data-href');
          if (url) window.open(url, '_blank');
        }
      });

      // Optional: pause/play video on hover
      const video = project.querySelector('video');
      if (video) {
        video.pause();
        project.addEventListener('mouseenter', () => video.play());
        project.addEventListener('mouseleave', () => {
          video.pause();
          video.currentTime = 0;
        });
      }
    });

    // Tag filtering
    const buttons = document.querySelectorAll('.filter-btn');
    const projects = document.querySelectorAll('.project');
    const activeTags = new Set();

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        const tag = button.dataset.tag;
        if (activeTags.has(tag)) {
          activeTags.delete(tag);
          button.classList.remove('active');
        } else {
          activeTags.add(tag);
          button.classList.add('active');
        }
        updateVisibility();
      });
    });

    function updateVisibility() {
      projects.forEach(project => {
        const tags = project.dataset.tags.split(" ");
        const matches = [...activeTags].every(tag => tags.includes(tag));
        if (activeTags.size === 0 || matches) {
          project.classList.remove('hidden');
        } else {
          project.classList.add('hidden');
        }
      });
    }
  </script>
</body>

</html>
