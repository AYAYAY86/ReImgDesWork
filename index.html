  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
      color: #000;
    }

    header {
      position: sticky;
      top: 0;
      background: white;
      padding: 1rem;
      border-bottom: 1px solid #ddd;
      z-index: 10;
    }

    header h1 {
      font-size: 1rem;
      margin: 0;
    }

    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      padding: 1rem;
    }

    .project {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      cursor: pointer;
    }

    .project img,
    .project video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .project:hover img,
    .project:hover video {
      transform: scale(1.05);
    }

    .project-title {
      position: absolute;
      bottom: 0;
      background: rgba(255, 255, 255, 0.8);
      width: 100%;
      padding: 0.5rem;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
  </style>
</head>
