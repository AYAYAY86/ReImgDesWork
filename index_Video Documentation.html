<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reimagine Design Tools</title>
  <style>
    body {
      margin: 0;
      font-family: 'Consolas', 'Menlo', 'Monaco', 'Courier New', monospace;
      background-color: #fff;
      color: #000;
    }

    header {
      position: sticky;
      top: 0;
      background: white;
      padding: 1rem 1rem 0.5rem 1rem;
      border-bottom: 1px solid #ddd;
      z-index: 10;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    header h1 {
      font-size: 1.25rem;
      margin: 0;
    }

    .header-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .header-btn {
      font-size: 0.8rem;
      margin: 0.15rem;
      padding: 0.3rem 0.6rem;
      background: black;
      color: white;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      transition: background 0.3s ease;
      line-height: 1;
    }

    .header-btn:hover {
      background: palevioletred;
    }

     .filters {
      margin-top: 0.25rem;
      margin-bottom: 0.25rem;
    }

    .filter-btn {
      display: inline-block;
      margin: 0rem;
      padding: 0.2rem .5rem;
      font-size: 0.8rem;
      background: #eee;
      border: 0px solid white;
      border-radius: 10px;
      cursor: pointer;
    }


    .filter-btn:hover {
      font-style: italic;
      color: palevioletred;
    }

    .filter-btn.active {
      background: black;
      color: white;
      font-style: italic;
    }

main {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1rem;
  padding: 1rem;
}

.project {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: #eee;
  cursor: pointer;
}

.project video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
}

.project:hover video {
  transform: scale(1.05);
}

.project-title {
  position: absolute;
  bottom: 0;
  background: rgba(255, 255, 255, 0.8);
  width: 100%;
  padding: 0.5rem;
  font-size: 0.8rem;
  box-sizing: border-box;
  text-align: left;
}

    .description {
      padding: 0.2rem;
      margin-top: 0.3rem;
    }

    .hidden {
      display: none !important;
    }

    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .lightbox.hidden {
      display: none;
    }

.lightbox-description {
  position: absolute;
  bottom: 1rem;
  left: 1rem;
  right: 1rem;
  background: rgba(255, 255, 255, 0.9);
  color: black;
  padding: 0.6rem;
  font-size: 0.85rem;
  font-style: italic;
  z-index: 10;
  text-align: left;
  border-radius: 4px;
}

    #closeBtn {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 2rem;
      color: white;
      cursor: pointer;
      font-family: sans-serif;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2.5rem;
      background: none;
      color: white;
      border: none;
      cursor: pointer;
      padding: 1rem;
      user-select: none;
      z-index: 1001;
    }

    #prevBtn { left: 1rem; }
    #nextBtn { right: 1rem; }

    .nav-btn:hover {
      color: palevioletred;
    }

    #lightbox-video {
      max-width: 50%;
      max-height: 80%;
      width: 100%;
      border: 0px solid white;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      border-radius: 8px;
      background: black;
    }
  </style>
</head>
<body>
<header>
  <div class="header-top">
    <a href="index.html" style="text-decoration:none; color:inherit;">
      <h1>Reimagine Design Tools</h1>
    </a>
    <div class="header-buttons">
      <a href="index_Process Documentation.html" class="header-btn">Process Documentation</a>
      <a href="video-doku.html" class="header-btn">Reimagine Design Tools</a>
    </div>
  </div>
  <div class="filters">
    <span class="filter-btn" data-tag="cursor">#cursor</span>
    <span class="filter-btn" data-tag="layout">#layout</span>
    <span class="filter-btn" data-tag="interaction">#interaction</span>
    <span class="filter-btn" data-tag="experiments">#experiments</span>
  </div>
</header>

  <main id="project-container"></main>

  <div id="lightbox" class="lightbox hidden">
    <span id="closeBtn">&times;</span>
    <div id="lightbox-description" class="lightbox-description"></div>
    <video id="lightbox-video" controls></video>
    <button id="prevBtn" class="nav-btn">&#10094;</button>
    <button id="nextBtn" class="nav-btn">&#10095;</button>
  </div>

  <script>
    const projectData = [
      {
        title: "Video 1",
        video: "img/donald_small_5.mp4",
        description: "Description for Video 1",
        tags: ["cursor", "interaction"]
      },
      {
        title: "Video 2",
        video: "img/donald_small_5.mp4",
        description: "Description for Video 2",
        tags: ["layout"]
      },
      {
        title: "Video 3",
        video: "img/donald_small_5.mp4",
        description: "Description for Video 3",
        tags: ["interaction"]
      }
    ];

    const container = document.getElementById("project-container");

    function renderProjects() {
      container.innerHTML = "";
      projectData.forEach((project, index) => {
        const tags = project.tags.join(" ");
        const html = `
          <div class="project" data-tags="${tags}" data-index="${index}">
            <video src="${project.video}" muted playsinline></video>
            <div class="project-title">
              <div class="description">${project.description}</div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML("beforeend", html);
      });
    }

    renderProjects();

    // Hover play
    document.addEventListener("mouseover", e => {
      if (e.target.tagName === "VIDEO") e.target.play();
    });
    document.addEventListener("mouseout", e => {
      if (e.target.tagName === "VIDEO") {
        e.target.pause();
        e.target.currentTime = 0;
      }
    });

    // Filter logic
    const filterButtons = document.querySelectorAll('.filter-btn');
    const activeTags = new Set();

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const tag = btn.dataset.tag;
        btn.classList.toggle('active');
        activeTags.has(tag) ? activeTags.delete(tag) : activeTags.add(tag);
        updateVisibility();
      });
    });

    function updateVisibility() {
      const projects = document.querySelectorAll('.project');
      projects.forEach(project => {
        const projectTags = project.dataset.tags.split(" ");
        const visible = [...activeTags].every(tag => projectTags.includes(tag));
        if (activeTags.size === 0 || visible) {
          project.classList.remove('hidden');
        } else {
          project.classList.add('hidden');
        }
      });
    }

    // Lightbox functionality
    const lightbox = document.getElementById("lightbox");
    const lightboxVideo = document.getElementById("lightbox-video");
    const lightboxDescription = document.getElementById("lightbox-description");
    const closeBtn = document.getElementById("closeBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let currentIndex = 0;

    container.addEventListener("click", e => {
      if (e.target.closest(".project")) {
        currentIndex = parseInt(e.target.closest(".project").dataset.index);
        openLightbox();
      }
    });

    closeBtn.addEventListener("click", closeLightbox);

    function openLightbox() {
      const project = projectData[currentIndex];
      lightboxDescription.innerText = project.description;
      lightboxVideo.src = project.video;
      lightbox.classList.remove("hidden");
      lightboxVideo.play();
    }

    function closeLightbox() {
      lightbox.classList.add("hidden");
      lightboxVideo.pause();
      lightboxVideo.currentTime = 0;
    }

    prevBtn.addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + projectData.length) % projectData.length;
      openLightbox();
    });

    nextBtn.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % projectData.length;
      openLightbox();
    });
  </script>
</body>
</html>
