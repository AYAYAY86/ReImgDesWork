<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>p5.js Code Editor</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    textarea { width: 100%; height: 200px; font-family: monospace; }
    iframe { width: 100%; height: 400px; border: 1px solid #ccc; margin-top: 20px; }
    button { margin-top: 10px; }
  </style>
</head>
<body>

<textarea id="editor">// Write your p5.js sketch here
function setup() {
  createCanvas(400, 400);
}

function draw() {
  background(200);
  ellipse(mouseX, mouseY, 50, 50);
}
</textarea>

<br>
<button onclick="runCode()">▶ Run</button>

<iframe id="preview"></iframe>

<script>
function runCode() {
  const userCode = document.getElementById('editor').value;

  const fullHTML = `
    <!DOCTYPE html>
    <html>
    <head>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"><\/script>
    </head>
    <body>
      <script>
        ${userCode.replace(/<\/script>/g, '<\\/script>')}
      <\/script>
    </body>
    </html>
  `;

  const blob = new Blob([fullHTML], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  document.getElementById('preview').src = url;
}
</script>

</body>
</html><!-- Stelle sicher, dass du ein iframe hast -->
