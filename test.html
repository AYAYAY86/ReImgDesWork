<!DOCTYPE html>
<html>
<head>
  <style>
    #capture {
      width: 400px;
      height: 300px;
      background: linear-gradient(to right, #f06, #4a90e2);
      color: white;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

<div id="capture">Hello, I'm being recorded!</div>
<button id="start">Start Recording</button>
<button id="stop">Stop & Download</button>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
  const captureDiv = document.getElementById("capture");
  const startBtn = document.getElementById("start");
  const stopBtn = document.getElementById("stop");

  let canvasStream;
  let recorder;
  let recordedChunks = [];
  let interval;

  startBtn.onclick = async () => {
    const canvas = document.createElement("canvas");
    canvas.width = captureDiv.offsetWidth;
    canvas.height = captureDiv.offsetHeight;
    const ctx = canvas.getContext("2d");

    // Start drawing frames
    interval = setInterval(async () => {
      const htmlCanvas = await html2canvas(captureDiv);
      ctx.drawImage(htmlCanvas, 0, 0);
    }, 100); // every 100ms

    // Record canvas
    canvasStream = canvas.captureStream(10); // 10 fps
    recorder = new MediaRecorder(canvasStream, { mimeType: "video/webm" });

    recorder.ondataavailable = (e) => recordedChunks.push(e.data);
    recorder.start();
  };

  stopBtn.onclick = () => {
    recorder.stop();
    clearInterval(interval);
    recorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: "video/webm" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "capture.webm";
      a.click();
    };
  };
</script>

</body>
</html>
