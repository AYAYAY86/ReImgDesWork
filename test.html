<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>p5.js GUI Elemente Übersicht</title>
  <script src="libaries/p5.min.js"></script>
</head>
<body>
  <script>
let points = [];

function setup() {
  createCanvas(600, 400);
  background(255);
}

function draw() {
  background(255);

  // Draw the line from stored points
  noFill();
  stroke(0);
  beginShape();
  for (let pt of points) {
    vertex(pt.x, pt.y);
  }
  endShape();
}

  </script>
</body>
</html>
